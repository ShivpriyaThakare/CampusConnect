{% extends "layouts/base.html" %}

{% block title %}Submit Feedback - {{ event.title }} - CampusConnect{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="glass-panel p-8 rounded-3xl">
        <div class="text-center mb-8">
            <span class="px-3 py-1 rounded-full text-xs font-semibold badge-amber mb-3 inline-block">Verified Attendee Review</span>
            <h1 class="text-2xl font-extrabold text-[#303247]">Event Feedback</h1>
            <p class="text-[#85899B] text-sm mt-1">Rate your experience attending <strong class="text-[#5B47A3]">{{ event.title }}</strong>.</p>
        </div>

        <form method="POST" action="{{ url_for('student.submit_feedback', event_id=event.id) }}" class="space-y-6">

            <div class="text-center">
                <label class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider mb-3">Overall Rating (1 to 5 Stars)</label>
                <div class="star-rating justify-center">
                    <input type="radio" id="star5" name="rating" value="5" {% if existing and existing.rating == 5 %}checked{% endif %}>
                    <label for="star5" title="5 stars">★</label>

                    <input type="radio" id="star4" name="rating" value="4" {% if existing and existing.rating == 4 %}checked{% endif %}>
                    <label for="star4" title="4 stars">★</label>

                    <input type="radio" id="star3" name="rating" value="3" {% if existing and existing.rating == 3 %}checked{% endif %}>
                    <label for="star3" title="3 stars">★</label>

                    <input type="radio" id="star2" name="rating" value="2" {% if existing and existing.rating == 2 %}checked{% endif %}>
                    <label for="star2" title="2 stars">★</label>

                    <input type="radio" id="star1" name="rating" value="1" {% if existing and existing.rating == 1 %}checked{% endif %}>
                    <label for="star1" title="1 star">★</label>
                </div>
            </div>

            <div>
                <label for="comments" class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider mb-2">Comments &amp; Suggestions</label>
                <textarea id="comments" name="comments" rows="4" placeholder="What did you enjoy most? How could future events be improved?"
                    class="w-full p-4 saas-input text-sm">{{ existing.comments if existing else '' }}</textarea>
            </div>

            <div class="flex items-center justify-end gap-3 pt-2">
                <a href="{{ url_for('student.dashboard') }}" class="px-5 py-2.5 rounded-xl btn-pastel-reset text-xs">Cancel</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl btn-pastel-primary text-xs">
                    {% if existing %}Update Feedback{% else %}Submit Feedback{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
