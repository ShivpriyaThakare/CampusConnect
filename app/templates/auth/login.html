{% extends "layouts/base.html" %}

{% block title %}Sign In - CampusConnect{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 relative py-12 overflow-hidden">
    <div class="hero-glow"></div>

    <div class="w-full max-w-md glass-panel p-8 rounded-3xl relative z-10">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-[#B8A8E8] to-[#B9D8F2] mx-auto flex items-center justify-center text-[#303247] mb-4 shadow-sm border border-[#E6E2F6]">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
            </div>
            <h2 class="text-2xl font-extrabold text-[#303247] tracking-tight">Welcome Back</h2>
            <p class="text-[#85899B] text-sm mt-1">Sign in to your CampusConnect account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5">
            <div>
                <label for="email" class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="user@college.edu"
                    class="w-full h-11 px-4 saas-input text-sm">
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <label for="password" class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider">Password</label>
                </div>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                    class="w-full h-11 px-4 saas-input text-sm">
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-[#5E6278] cursor-pointer">
                    <input type="checkbox" name="remember" class="w-4 h-4 rounded border-[#D6D2EA] text-[#7A63C9] focus:ring-[#B8A8E8]">
                    <span class="text-xs font-medium">Remember me</span>
                </label>
            </div>

            <button type="submit"
                class="w-full h-11 px-4 rounded-xl btn-pastel-primary text-sm flex items-center justify-center gap-2 group">
                <span>Sign In</span>
                <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-[#EAE8F4] text-center text-xs text-[#85899B]">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}" class="text-[#5B47A3] font-semibold hover:underline ml-1">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
