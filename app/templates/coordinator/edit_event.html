{% extends "layouts/base.html" %}

{% block title %}Edit {{ event.title }} - Coordinator - CampusConnect{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-[#303247] tracking-tight">Edit Event Details</h1>
        <p class="text-[#85899B] text-sm mt-1">Update event schedule, venue, status, or banner.</p>
    </div>

    <div class="glass-panel p-8 rounded-3xl">
        <form method="POST" action="{{ url_for('coordinator.edit_event', event_id=event.id) }}" enctype="multipart/form-data" class="space-y-6">

            <div>
                <label for="title" class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider mb-2">Event Title</label>
                <input type="text" id="title" name="title" value="{{ event.title }}" required
                    class="w-full h-11 px-4 saas-input text-sm">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label for="category" class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider mb-2">Event Category</label>
                    <select id="category" name="category" class="w-full h-11 px-4 saas-input text-sm">
                        <option value="Technical" {% if event.category == 'Technical' %}selected{% endif %}>Technical</option>
                        <option value="Cultural" {% if event.category == 'Cultural' %}selected{% endif %}>Cultural</option>
                        <option value="Sports" {% if event.category == 'Sports' %}selected{% endif %}>Sports</option>
                        <option value="Workshop" {% if event.category == 'Workshop' %}selected{% endif %}>Workshop</option>
                        <option value="Seminar" {% if event.category == 'Seminar' %}selected{% endif %}>Seminar</option>
                        <option value="Hackathon" {% if event.category == 'Hackathon' %}selected{% endif %}>Hackathon</option>
                        <option value="General" {% if event.category == 'General' %}selected{% endif %}>General</option>
                    </select>
                </div>

                <div>
                    <label for="venue" class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider mb-2">Venue</label>
                    <input type="text" id="venue" name="venue" value="{{ event.venue }}" required
                        class="w-full h-11 px-4 saas-input text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label for="event_date" class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider mb-2">Event Date &amp; Time</label>
                    <input type="datetime-local" id="event_date" name="event_date" value="{{ event.event_date.strftime('%Y-%m-%dT%H:%M') }}" required
                        class="w-full h-11 px-4 saas-input text-sm">
                </div>

                <div>
                    <label for="reg_deadline" class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider mb-2">Registration Deadline</label>
                    <input type="datetime-local" id="reg_deadline" name="reg_deadline" value="{{ event.reg_deadline.strftime('%Y-%m-%dT%H:%M') }}" required
                        class="w-full h-11 px-4 saas-input text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                <div>
                    <label for="capacity" class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider mb-2">Participant Limit</label>
                    <input type="number" id="capacity" name="capacity" value="{{ event.capacity }}" min="1" required
                        class="w-full h-11 px-4 saas-input text-sm">
                </div>

                <div>
                    <label for="allocated_budget" class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider mb-2">Allocated Budget ($)</label>
                    <input type="number" step="0.01" min="0" id="allocated_budget" name="allocated_budget" value="{{ event.allocated_budget }}"
                        class="w-full h-11 px-4 saas-input text-sm">
                </div>

                <div>
                    <label for="status" class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider mb-2">Status</label>
                    <select id="status" name="status" class="w-full h-11 px-4 saas-input text-sm">
                        <option value="draft" {% if event.status == 'draft' %}selected{% endif %}>Draft</option>
                        <option value="published" {% if event.status == 'published' %}selected{% endif %}>Published</option>
                        <option value="completed" {% if event.status == 'completed' %}selected{% endif %}>Completed</option>
                        <option value="cancelled" {% if event.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
                    </select>
                </div>
            </div>

            <div>
                <label for="description" class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider mb-2">Description</label>
                <textarea id="description" name="description" rows="4"
                    class="w-full p-4 saas-input text-sm">{{ event.description or '' }}</textarea>
            </div>

            <div>
                <label for="banner" class="block text-xs font-semibold text-[#5E6278] uppercase tracking-wider mb-2">Update Cover Banner</label>
                <input type="file" id="banner" name="banner" accept="image/*"
                    class="w-full text-xs text-[#85899B] file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[#B8A8E8] file:text-[#303247] hover:file:bg-[#A593DF]">
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-[#EAE8F4]">
                <a href="{{ url_for('coordinator.event_details', event_id=event.id) }}" class="px-5 py-2.5 rounded-xl btn-pastel-reset text-xs">Cancel</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl btn-pastel-primary text-xs">Update Event</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
