{% extends "layouts/base.html" %}

{% block title %}Page Not Found (404) - CampusConnect{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4">
    <div class="w-20 h-20 rounded-3xl bg-[#EFEBF9] border border-[#DFD7F4] flex items-center justify-center text-[#5B47A3] mb-6">
        <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    </div>
    <h1 class="text-4xl font-extrabold text-[#303247] mb-2">Page Not Found</h1>
    <p class="text-[#85899B] max-w-md mb-8">The page you were looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('main.index') }}" class="px-6 py-2.5 rounded-xl btn-pastel-primary text-sm">Back to Safety</a>
</div>
{% endblock %}
